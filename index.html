// ── HTML 빌더 ──
function buildHTML(d) {
  const metaHTML = d.metaRows.map(row => {
    let valueHTML = '';
    if (row.type === 'time') {
      const showAm = row.showAm !== false;
      const showPm = row.showPm !== false;
      const parts = [];
      if (showAm) parts.push(`<span class="session-badge">오전</span> ${row.amTime}`);
      if (showPm) parts.push(`<span class="session-badge">오후</span> ${row.pmTime}`);
      valueHTML = parts.join('<br>');
    } else {
      valueHTML = (row.main || '').replace(/\n/g, '<br>');
    }
    const smallsHTML = (row.smalls||[]).map(s=>`<small>${s}</small>`).join('');
    return `<div class="meta-row"><span class="meta-row-label">${row.label}</span><span class="meta-row-value${row.accent?' accent':''}">${valueHTML}${smallsHTML}</span></div>`;
  }).join('');

  const noticeHTML = d.noticeItems.length > 0
    ? `<div class="notice">${d.noticeItems.map(i=>`<div class="notice-item"><div class="notice-dot"></div><span>${i}</span></div>`).join('')}</div>`
    : '';

  const benefitsHTML = d.benefits.length > 0
    ? `<div class="benefit-box"><div class="benefit-title">당일 한정 특별 혜택</div>${d.benefits.map(b=>`<div class="benefit-item"><div class="benefit-icon">▶</div><div><div class="benefit-name">${b.name}</div><div class="benefit-sub">${b.sub}</div></div></div>`).join('')}</div>`
    : '';

  const sessionCols = d.sessions.length === 1 ? '1fr' : '1fr 1fr';
  const sessionsHTML = d.sessions.map(s=>`<div class="time-option"><input type="radio" name="session" id="session-${s.id}" value="${s.label} ${s.time}"><label for="session-${s.id}"><span class="time-label-title">${s.label}</span><span class="time-label-sub">${s.time}</span><span class="slot-avail-badge" id="slot-avail-${s.id}"></span></label></div>`).join('');

  const titleMainHTML = (d.titleMain||'').replace(/\n/g, '<br>');
  const descHTML = (d.desc||'').replace(/\n/g, '<br>');

  const submitBtn = d.closed
    ? `<button class="submit-btn" id="submit-btn" type="button" disabled>접수가 마감되었습니다</button>`
    : `<button class="submit-btn" id="submit-btn" type="button">신청 완료하기 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;

  const customFieldsHTML = d.customFields.map(f => {
    if (f.type === 'select') {
      const opts = f.options.map(o=>`<option value="${o}">${o}</option>`).join('');
      return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><select id="cf-${f.id}"><option value="" disabled selected>${f.placeholder||'선택해주세요'}</option>${opts}</select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><textarea id="cf-${f.id}" placeholder="${f.placeholder||''}" style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:14px 16px;font-size:15px;font-family:inherit;outline:none;border-radius:3px;resize:vertical;min-height:88px;line-height:1.6;"></textarea></div>`;
    }
    return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><input type="${f.type==='number'?'number':'text'}" id="cf-${f.id}" placeholder="${f.placeholder||''}"></div>`;
  }).join('');

  const customFieldsVars    = d.customFields.map(f => `var cf_${f.id}=document.getElementById('cf-${f.id}')?(document.getElementById('cf-${f.id}').value||''):'';`).join('');
  const customFieldsPayload = d.customFields.map(f => `"${f.label}":cf_${f.id}`).join(',');
  const customFieldsRequired = d.customFields.filter(f=>f.required).map(f=>`!cf_${f.id}`).join('||');

  const bgUrl     = d.bgImage ? d.bgImage : 'pyxis-bg.jpg';
  const bgOpacity = (d.bgOpacity ?? 45) / 100;
  const bgSize    = (d.bgSize ?? 100) + '%';
  const bgPos     = `${d.bgPosX ?? 50}% ${d.bgPosY ?? 50}%`;

  const maxPerSlot  = d.maxPerSlot ?? 15;
  const sessionsJson = JSON.stringify(d.sessions.map(s=>({id:s.id, key:s.label+' '+s.time})));

  return `<!DOCTYPE html>

.notice-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px;}
.notice-link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}
.submit-btn{width:100%;padding:17px;background:var(--accent);color:#0c0c0d;border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border-radius:3px;letter-spacing:.5px;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.submit-btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;}
.submit-note{font-size:14px;color:var(--text3);text-align:center;margin-top:14px;line-height:1.6;}
.benefit-box{background:var(--surface);border:1px solid rgba(243,146,0,0.18);border-radius:3px;padding:16px 18px;margin-bottom:28px;}
.benefit-title{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;font-weight:500;}
.benefit-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.benefit-item:last-child{border-bottom:none;padding-bottom:2px;}
.benefit-icon{color:var(--accent);font-size:11px;flex-shrink:0;padding-top:3px;}
.benefit-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px;}
.benefit-sub{font-size:13px;color:var(--text2);line-height:1.5;}
.success{display:none;text-align:center;padding:60px 24px;}
.success.show{display:block;}
.success-icon{width:56px;height:56px;background:var(--accent-dim);border:1px solid rgba(243,146,0,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-size:22px;}
.success h3{font-size:22px;font-weight:700;margin-bottom:12px;}
.success p{font-size:15px;color:var(--text2);line-height:1.7;}
.tab-bar{display:flex;gap:4px;margin-bottom:28px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px;}
.tab-btn{flex:1;padding:10px;background:transparent;border:none;border-radius:2px;color:var(--text2);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s,color .15s;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tab-btn.active{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.apply-panel.hide{display:none;}
.cancel-panel{display:none;}
.cancel-panel.show{display:block;}
.cancel-step{display:none;}
.cancel-step.show{display:block;}
.reservation-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:20px 22px;margin-bottom:20px;}
.reservation-card-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-bottom:14px;}
.reservation-card-name{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}
.reservation-card-session{font-size:14px;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:6px;}
.cancel-btn{width:100%;padding:15px;background:transparent;border:1px solid rgba(240,80,64,0.35);color:rgba(240,80,64,0.8);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border-radius:3px;transition:background .15s,color .15s,border-color .15s;margin-bottom:10px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.cancel-btn:hover:not(:disabled){background:rgba(240,80,64,0.08);color:rgb(240,80,64);border-color:rgba(240,80,64,0.6);}
.cancel-btn:disabled{opacity:.4;cursor:not-allowed;}
.cancel-back-btn{width:100%;padding:13px;background:transparent;border:1px solid var(--border);color:var(--text2);font-size:14px;font-family:inherit;cursor:pointer;border-radius:3px;transition:border-color .15s,color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.cancel-back-btn:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
.cancel-success{text-align:center;padding:48px 0;}
.cancel-success-icon{width:52px;height:52px;background:rgba(100,200,120,0.08);border:1px solid rgba(100,200,120,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px;}
.cancel-success h3{font-size:20px;font-weight:700;margin-bottom:10px;}
.cancel-success p{font-size:14px;color:var(--text2);line-height:1.7;}
.c-error{font-size:14px;color:rgba(240,80,64,0.8);text-align:center;margin-top:12px;display:none;line-height:1.6;}
.closed-box{text-align:center;padding:60px 24px;}
.closed-icon{font-size:40px;margin-bottom:20px;}
.closed-box h3{font-size:22px;font-weight:700;margin-bottom:12px;}
.closed-box p{font-size:15px;color:var(--text2);line-height:1.8;}
.closed-badge{display:inline-block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(240,80,64,0.7);border:1px solid rgba(240,80,64,0.2);border-radius:2px;padding:4px 10px;margin-bottom:20px;}
.slot-avail-badge{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;margin-top:3px;min-height:16px;}
.slot-avail-badge.ok{color:var(--accent);}
.slot-avail-badge.few{color:#f5a623;}
.slot-avail-badge.full{color:rgba(255,255,255,0.25);}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:820px){.page{grid-template-columns:1fr;}.left{position:static;height:auto;padding:40px 24px;overflow:visible;}.left-desc{display:none;}.left-footer{display:none;}.left-title{font-size:13vw;line-height:.88;}.left-title-models{font-size:13vw;}.left-eyebrow{font-size:5vw;}.deco-ring{display:none;}.right{padding:40px 24px;}.field-row{grid-template-columns:1fr;gap:0;}.field-row .field:first-child{margin-bottom:20px;}}
@media(max-width:480px){.left{padding:24px 20px;}.right{padding:32px 20px;}.consent-options{grid-template-columns:1fr !important;}}
</style>
</head>
<body>
<div class="page">
  <div class="left">
    <div class="left-bg"></div>
    <div class="deco-ring"></div>
    <div class="left-inner">
      <div class="left-tag">${d.tag}</div>
      <div class="left-eyebrow">${d.eyebrow}</div>
      <h1 class="left-title">
        ${titleMainHTML} <span class="left-title-models">${d.titleModels}</span>
        <span class="sub">${d.titleSub}</span>
      </h1>
      <p class="left-desc">${descHTML}</p>
      <div class="meta-list">${metaHTML}</div>
    </div>
    <div class="left-footer">Blackmagic Design 공식 총판 · 하이픽셀플러스<br>문의: ${d.footerContact}</div>
  </div>
  <div class="right">
    <div id="form-body">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-apply" onclick="switchTab('apply')" type="button">참가 신청</button>
        <button class="tab-btn" id="tab-cancel" onclick="switchTab('cancel')" type="button">예약 취소</button>
      </div>

      <!-- ══ 신청 패널 ══ -->
      <div class="apply-panel" id="apply-panel">
        <div class="closed-box" id="closed-box" style="display:none;">
          <div class="closed-icon">🙏</div>
          <div class="closed-badge">접수 마감</div>
          <h3>신청 접수가 마감되었습니다</h3>
          <p>${d.closedMsg}</p>
        </div>
        <div id="apply-form">
          <div class="form-header">
            <h2>${d.formTitle}</h2>
            <p>${d.formSubtitle}</p>
          </div>
          ${noticeHTML}
          ${benefitsHTML}
          <div class="field-row">
            <div class="field"><label>${(d.fixedFields?.find(f=>f.id==='name')?.label)||'이름'} <span class="req">*</span></label><input type="text" id="f-name" placeholder="${(d.fixedFields?.find(f=>f.id==='name')?.placeholder)||'홍길동'}" autocomplete="name"></div>
            <div class="field"><label>${(d.fixedFields?.find(f=>f.id==='phone')?.label)||'전화번호'} <span class="req">*</span></label><input type="tel" id="f-phone" placeholder="${(d.fixedFields?.find(f=>f.id==='phone')?.placeholder)||'010-0000-0000'}" autocomplete="tel" oninput="formatPhone(this)" maxlength="13"></div>
          </div>
          <div class="field"><label>${(d.fixedFields?.find(f=>f.id==='email')?.label)||'이메일'} <span class="req">*</span></label><input type="email" id="f-email" placeholder="${(d.fixedFields?.find(f=>f.id==='email')?.placeholder)||'이메일 주소'}" autocomplete="email"></div>
          <div class="field"><label>${(d.fixedFields?.find(f=>f.id==='company')?.label)||'직장 또는 소속'} <span class="req">*</span></label><input type="text" id="f-company" placeholder="${(d.fixedFields?.find(f=>f.id==='company')?.placeholder)||'직장 또는 소속'}"></div>
          ${customFieldsHTML}
          <div class="field">
            <label>참가 일시 <span class="req">*</span></label>
            <div class="time-options" style="grid-template-columns:${sessionCols};">${sessionsHTML}</div>
          </div>
          <div class="field">
            <label>이메일 수신 동의 <span style="color:var(--text3);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:400">(선택)</span></label>
            <div class="consent-options">
              <div class="consent-option"><input type="radio" name="email-consent" id="consent-yes" value="동의"><label for="consent-yes"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>예, 동의합니다</label></div>
              <div class="consent-option"><input type="radio" name="email-consent" id="consent-no" value="미동의"><label for="consent-no">아니요</label></div>
            </div>
          </div>
          <div class="agree">
            <input type="checkbox" id="f-agree">
            <label for="f-agree" class="agree-text" style="margin:0;cursor:pointer"><strong>개인정보 수집 및 이용에 동의합니다.</strong><br>${d.agreeText}</label>
          </div>
          ${submitBtn}
          <p class="submit-note">수집된 정보는 세미나 운영 목적으로만 사용됩니다</p>
        </div>
      </div>

      <!-- ══ 취소 패널 ══ -->
      <div class="cancel-panel" id="cancel-panel">
        <div class="cancel-step show" id="cancel-step1">
          <div class="form-header">
            <h2>예약 취소</h2>
            <p>신청 시 입력하신 전화번호로 예약을 조회합니다.</p>
          </div>
          <div class="field">
            <label>전화번호 <span class="req">*</span></label>
            <input type="tel" id="c-phone" placeholder="010-0000-0000" autocomplete="tel" oninput="formatPhone(this)" maxlength="13">
          </div>
          <button class="submit-btn" id="lookup-btn" type="button" onclick="lookupReservation()">
            예약 조회하기
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p class="c-error" id="c-lookup-error"></p>
        </div>
        <div class="cancel-step" id="cancel-step2">
          <div class="form-header">
            <h2>예약 확인</h2>
            <p>아래 예약 정보를 확인 후 취소해 주세요.</p>
          </div>
          <div class="reservation-card">
            <div class="reservation-card-label">예약 정보</div>
            <div class="reservation-card-name" id="c-res-name"></div>
            <div class="reservation-card-session">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 6h12M4.5 1v2M9.5 1v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              <span id="c-res-session-text"></span>
            </div>
          </div>
          <button class="cancel-btn" id="confirm-cancel-btn" type="button" onclick="confirmCancel()">이 예약을 취소합니다</button>
          <button class="cancel-back-btn" type="button" onclick="resetCancel()">돌아가기</button>
        </div>
        <div class="cancel-step" id="cancel-step3">
          <div class="cancel-success">
            <div class="cancel-success-icon">✓</div>
            <h3>취소가 완료되었습니다</h3>
            <p>예약이 정상적으로 취소되었습니다.<br>다시 신청하시려면 신청 탭으로 이동해 주세요.</p>
            <button class="submit-btn" type="button" onclick="switchTab('apply')" style="margin-top:28px;">다시 신청하기 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <div class="success" id="msg-success">
      <div class="success-icon">✓</div>
      <h3>${d.successTitle}</h3>
      <p>${(d.successMsg||'').replace(/\n/g,'<br>')}</p>
    </div>
  </div>
</div>
<script>
var SCRIPT_URL='${d.scriptUrl}';
var MAX_PER_SLOT=${maxPerSlot};
var IS_CLOSED=${d.closed ? 'true' : 'false'};
var SESSIONS=${sessionsJson};

function formatPhone(el){var v=el.value.replace(/\\D/g,'').slice(0,11);if(v.length<4)el.value=v;else if(v.length<8)el.value=v.slice(0,3)+'-'+v.slice(3);else el.value=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);}
function getRadioValue(name){var c=document.querySelector('input[name="'+name+'"]:checked');return c?c.value:'';}

function applyClosedState(){
  var applyForm=document.getElementById('apply-form');
  var closedBox=document.getElementById('closed-box');
  var tabApply=document.getElementById('tab-apply');
  if(applyForm)applyForm.style.display='none';
  if(closedBox)closedBox.style.display='block';
  if(tabApply)tabApply.style.opacity='0.5';
}

function switchTab(tab){
  var applyPanel=document.getElementById('apply-panel');
  var cancelPanel=document.getElementById('cancel-panel');
  var tabApply=document.getElementById('tab-apply');
  var tabCancel=document.getElementById('tab-cancel');
  if(tab==='apply'){
    applyPanel.classList.remove('hide');
    cancelPanel.classList.remove('show');
    tabApply.classList.add('active');
    tabCancel.classList.remove('active');
  }else{
    applyPanel.classList.add('hide');
    cancelPanel.classList.add('show');
    tabApply.classList.remove('active');
    tabCancel.classList.add('active');
    resetCancel();
  }
}

var foundPhone='';
function resetCancel(){
  ['cancel-step1','cancel-step2','cancel-step3'].forEach(function(id){document.getElementById(id).classList.remove('show');});
  document.getElementById('cancel-step1').classList.add('show');
  var cp=document.getElementById('c-phone');if(cp)cp.value='';
  var errEl=document.getElementById('c-lookup-error');if(errEl)errEl.style.display='none';
  var lb=document.getElementById('lookup-btn');
  if(lb){lb.disabled=false;lb.innerHTML='예약 조회하기 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
  foundPhone='';
}

async function lookupReservation(){
  var phone=document.getElementById('c-phone').value.trim();
  var errEl=document.getElementById('c-lookup-error');
  var lb=document.getElementById('lookup-btn');
  errEl.style.display='none';
  if(!phone)return;
  lb.disabled=true;
  lb.innerHTML='<span style="opacity:.6">조회 중...</span>';
  try{
    var r=await fetch(SCRIPT_URL+'?action=getReservation&phone='+encodeURIComponent(phone));
    var data=await r.json();
    if(data.found){
      foundPhone=phone;
      document.getElementById('c-res-name').textContent=data.name+' 님';
      document.getElementById('c-res-session-text').textContent=data.session;
      document.getElementById('cancel-step1').classList.remove('show');
      document.getElementById('cancel-step2').classList.add('show');
    }else{
      errEl.textContent='해당 전화번호로 등록된 예약을 찾을 수 없습니다.';
      errEl.style.display='block';
      lb.disabled=false;
      lb.innerHTML='예약 조회하기 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
  }catch(e){
    errEl.textContent='조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    errEl.style.display='block';
    lb.disabled=false;
    lb.innerHTML='예약 조회하기 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
}

async function confirmCancel(){
  if(!foundPhone)return;
  var cb=document.getElementById('confirm-cancel-btn');
  cb.disabled=true;cb.textContent='취소 처리 중...';
  try{
    await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'cancelReservation',phone:foundPhone})});
    document.getElementById('cancel-step2').classList.remove('show');
    document.getElementById('cancel-step3').classList.add('show');
  }catch(e){
    alert('오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    cb.disabled=false;cb.textContent='이 예약을 취소합니다';
  }
}

function loadSlots(){
  var loadingEl=document.getElementById('slots-loading');
  if(loadingEl)loadingEl.style.display='flex';
  fetch(SCRIPT_URL+'?action=getSlots')
    .then(function(r){return r.json();})
    .then(function(counts){updateSlotBadges(counts);if(loadingEl)loadingEl.style.display='none';})
    .catch(function(){updateSlotBadges({});if(loadingEl)loadingEl.style.display='none';});
}

function updateSlotBadges(counts){
  SESSIONS.forEach(function(s){
    var badge=document.getElementById('slot-avail-'+s.id);
    var inp=document.querySelector('input[value="'+s.key+'"]');
    if(!badge)return;
    var count=counts[s.key]||0;
    var avail=MAX_PER_SLOT-count;
    if(avail<=0){
      badge.textContent='마감';
      badge.className='slot-avail-badge full';
      if(inp){
        inp.disabled=true;
        var lbl=inp.nextElementSibling;
        if(lbl){lbl.style.opacity='.4';lbl.style.cursor='not-allowed';lbl.style.pointerEvents='none';}
      }
    }else if(avail<=3){
      badge.textContent=avail+'석 남음';
      badge.className='slot-avail-badge few';
    }else{
      badge.textContent=avail+'석 남음';
      badge.className='slot-avail-badge ok';
    }
  });
}

async function submitForm(){
  var name=document.getElementById('f-name').value.trim();
  var phone=document.getElementById('f-phone').value.trim();
  var email=document.getElementById('f-email').value.trim();
  var company=document.getElementById('f-company').value.trim();
  ${customFieldsVars}
  var session=getRadioValue('session');
  var consent=getRadioValue('email-consent')||'미응답';
  var agreed=document.getElementById('f-agree').checked;
  if(!name||!phone||!email||!company${customFieldsRequired?'||'+customFieldsRequired:''}){shake();return;}
  if(!session){var tf=document.querySelector('.time-options');tf.style.outline='1px solid rgba(240,80,64,0.5)';tf.style.borderRadius='3px';setTimeout(function(){tf.style.outline='';},1500);return;}
  if(!agreed){var ae=document.querySelector('.agree');ae.style.borderColor='rgba(240,80,64,0.5)';setTimeout(function(){ae.style.borderColor='';},1500);return;}
  var btn=document.getElementById('submit-btn');btn.disabled=true;btn.innerHTML='<span style="opacity:.6">제출 중...</span>';
  try{
    await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submit',name:name,phone:phone,email:email,company:company,${customFieldsPayload?customFieldsPayload+',':''}session:session,emailConsent:consent,timestamp:new Date().toLocaleString('ko-KR')})});
    document.getElementById('form-body').style.display='none';
    document.getElementById('msg-success').classList.add('show');
  }catch(e){
    alert('오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    btn.disabled=false;btn.innerHTML='신청 완료하기 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
}

function shake(){var f=document.getElementById('apply-panel');f.style.transition='transform .08s';f.style.transform='translateX(-6px)';setTimeout(function(){f.style.transform='translateX(5px)';},80);setTimeout(function(){f.style.transform='translateX(-4px)';},160);setTimeout(function(){f.style.transform='translateX(0)';},240);}

document.addEventListener('DOMContentLoaded',function(){
  if(IS_CLOSED){applyClosedState();}
  else{loadSlots();}
  var btn=document.getElementById('submit-btn');
  if(btn&&!btn.disabled){
    btn.addEventListener('click',function(e){e.preventDefault();submitForm();});
    btn.addEventListener('touchend',function(e){e.preventDefault();submitForm();});
  }
  var lb=document.getElementById('lookup-btn');
  if(lb){lb.addEventListener('touchend',function(e){e.preventDefault();lookupReservation();});}
  var cb=document.getElementById('confirm-cancel-btn');
  if(cb){cb.addEventListener('touchend',function(e){e.preventDefault();confirmCancel();});}
});
<\/script>

}

// ── 메인 앱 ──
function App() {
  const [d, setD] = useState(DEFAULT);
  const [toast, setToast] = useState('');

  const upd = (key, val) => setD(prev => ({ ...prev, [key]: val }));

  const moveItem = (key, idx, dir) => setD(prev => {
    const arr = [...prev[key]];
    const ni = idx + dir;
    if (ni < 0 || ni >= arr.length) return prev;
    [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
    return { ...prev, [key]: arr };
  });

  const updMetaRow    = (id, key, val) => setD(prev => ({ ...prev, metaRows: prev.metaRows.map(r => r.id===id ? {...r,[key]:val} : r) }));
  const updMetaSmall  = (id, i, val)   => setD(prev => ({ ...prev, metaRows: prev.metaRows.map(r => { if(r.id!==id)return r; const s=[...(r.smalls||[])]; s[i]=val; return {...r,smalls:s}; }) }));
  const addMetaSmall  = (id)           => setD(prev => ({ ...prev, metaRows: prev.metaRows.map(r => r.id===id ? {...r,smalls:[...(r.smalls||[]),'']} : r) }));
  const delMetaSmall  = (id, i)        => setD(prev => ({ ...prev, metaRows: prev.metaRows.map(r => r.id===id ? {...r,smalls:(r.smalls||[]).filter((_,j)=>j!==i)} : r) }));
  const delMetaRow    = (id)           => setD(prev => ({ ...prev, metaRows: prev.metaRows.filter(r => r.id!==id) }));
  const addMetaRow    = ()             => setD(prev => ({ ...prev, metaRows: [...prev.metaRows, {id:uid(),label:'새 항목',type:'text',main:'',smalls:[],accent:false}] }));

  const updBenefit = (i, key, val) => setD(prev => { const b=[...prev.benefits]; b[i]={...b[i],[key]:val}; return {...prev,benefits:b}; });
  const addBenefit = ()            => setD(prev => ({ ...prev, benefits:[...prev.benefits,{id:uid(),name:'새 혜택',sub:''}] }));
  const delBenefit = (i)           => setD(prev => ({ ...prev, benefits:prev.benefits.filter((_,j)=>j!==i) }));

  const updNotice = (i, val) => setD(prev => { const n=[...prev.noticeItems]; n[i]=val; return {...prev,noticeItems:n}; });
  const addNotice = ()       => setD(prev => ({ ...prev, noticeItems:[...prev.noticeItems,'새 안내 문구'] }));
  const delNotice = (i)      => setD(prev => ({ ...prev, noticeItems:prev.noticeItems.filter((_,j)=>j!==i) }));

  const updSession = (i, key, val) => setD(prev => { const s=[...prev.sessions]; s[i]={...s[i],[key]:val}; return {...prev,sessions:s}; });
  const addSession = ()            => setD(prev => ({ ...prev, sessions:[...prev.sessions,{id:uid(),label:'날짜 오전/오후',time:'00:00 – 00:00'}] }));
  const delSession = (i)           => setD(prev => ({ ...prev, sessions:prev.sessions.filter((_,j)=>j!==i) }));

  const updFixedField  = (id, key, val) => setD(prev => ({ ...prev, fixedFields: (prev.fixedFields||[]).map(f => f.id===id ? {...f,[key]:val} : f) }));
  // ✅ 수정: updCustomField 함수 추가 (기존 코드에 누락되어 있었음)
  const updCustomField = (i, key, val)  => setD(prev => { const cf=[...prev.customFields]; cf[i]={...cf[i],[key]:val}; return {...prev,customFields:cf}; });
  const addCustomField = ()             => setD(prev => ({ ...prev, customFields:[...prev.customFields,{id:uid(),type:'text',label:'새 필드',placeholder:'',required:false,options:[]}] }));
  const delCustomField = (i)            => setD(prev => ({ ...prev, customFields:prev.customFields.filter((_,j)=>j!==i) }));

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(''),2500); };

  const exportHTML = () => {
    const html = buildHTML(d);
    const blob = new Blob([html],{type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='seminar-form.html'; a.click();
    URL.revokeObjectURL(url);
    showToast('📥 모집폼 HTML이 저장됐습니다!');
  };

  const importHTML = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const match = text.match(/<!--\s*EDITOR_DATA:([\s\S]*?)-->/);
      if (match) {
        try {
          const data = JSON.parse(match[1].trim());
          setD(data);
          showToast('✅ 파일을 성공적으로 불러왔습니다!');
        } catch(err) {
          showToast('❌ 데이터 파싱 오류. 에디터로 저장한 파일인지 확인해주세요.');
        }
      } else {
        showToast('❌ 에디터 데이터를 찾을 수 없습니다. 이 에디터로 내보낸 파일만 불러올 수 있습니다.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const ColorRow = ({ label, valKey }) => (
    <div style={{ display:'flex', alignItems:'center', gap:'8px', marginBottom:'8px' }}>
      <label style={{ ...LS, margin:0, minWidth:'80px' }}>{label}</label>
      <input type="color" value={d[valKey]} onChange={e=>upd(valKey,e.target.value)}
        style={{ width:'36px', height:'28px', border:'1px solid #d1d5db', borderRadius:'4px', padding:'1px', cursor:'pointer' }} />
      <input style={{ ...IS, width:'90px', fontFamily:'monospace', fontSize:'12px' }} value={d[valKey]} onChange={e=>upd(valKey,e.target.value)} />
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh' }}>
      {/* 툴바 */}
      <div style={{ background:'#0c0c0d', borderBottom:'1px solid rgba(255,255,255,0.08)', padding:'0 20px', height:'52px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
          <span style={{ color:'#f39200', fontWeight:'700', fontSize:'14px' }}>PYXIS</span>
          <span style={{ color:'rgba(255,255,255,0.3)' }}>|</span>
          <span style={{ color:'rgba(255,255,255,0.7)', fontSize:'13px' }}>세미나 모집폼 에디터</span>

        <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>

                </div>
              </div>
            ))}
          </div>

          {/* 왼쪽 패널 */}
          <div style={SEC}>
            <div style={SECTITLE}>🎬 왼쪽 패널</div>
            <div style={FG}><label style={LS}>상단 태그</label><input style={IS} value={d.tag} onChange={e=>upd('tag',e.target.value)} /></div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px', marginBottom:'10px' }}>
              <div><label style={LS}>눈썹 텍스트</label><input style={IS} value={d.eyebrow} onChange={e=>upd('eyebrow',e.target.value)} /></div>
              <div><label style={LS}>모델명</label><input style={IS} value={d.titleModels} onChange={e=>upd('titleModels',e.target.value)} /></div>
            </div>
            <div style={FG}>
              <label style={LS}>메인 타이틀 <span style={{ color:'#22c55e', fontWeight:'400' }}>(엔터로 줄바꿈 가능)</span></label>
              <textarea style={{ ...TS, minHeight:'60px' }} value={d.titleMain} onChange={e=>upd('titleMain',e.target.value)} />
            </div>
            <div style={FG}><label style={LS}>부제</label><input style={IS} value={d.titleSub} onChange={e=>upd('titleSub',e.target.value)} /></div>
            <div style={FG}><label style={LS}>설명 (엔터=줄바꿈)</label><textarea style={TS} value={d.desc} onChange={e=>upd('desc',e.target.value)} /></div>
            <div style={FG}><label style={LS}>문의 연락처</label><input style={IS} value={d.footerContact} onChange={e=>upd('footerContact',e.target.value)} /></div>
          </div>

          {/* 세미나 정보 탭 */}
          <div style={SEC}>
            <div style={SECTITLE}>📋 세미나 정보 탭 <span style={{ fontWeight:400, color:'#9ca3af' }}>(추가/삭제 가능)</span></div>
            {d.metaRows.map((row, idx) => (
              <MetaRowEditor key={row.id} row={row} idx={idx} total={d.metaRows.length}
                onUpdate={(key,val)=>updMetaRow(row.id,key,val)}
                onDelete={()=>delMetaRow(row.id)}
                onMove={(dir)=>moveItem('metaRows',idx,dir)}
                onAddSmall={()=>addMetaSmall(row.id)}
                onUpdateSmall={(i,val)=>updMetaSmall(row.id,i,val)}
                onDeleteSmall={(i)=>delMetaSmall(row.id,i)} />
            ))}
            <button onClick={addMetaRow} style={{ width:'100%', padding:'8px', borderRadius:'6px', border:'1px dashed #f39200', background:'rgba(243,146,0,0.04)', color:'#f39200', fontSize:'13px', fontWeight:'600' }}>+ 탭 추가</button>
          </div>

          {/* 안내 문구 */}
          <div style={SEC}>
            <div style={SECTITLE}>📢 안내 문구 {d.noticeItems.length === 0 && <span style={{ fontWeight:400, color:'#9ca3af' }}>(비어있으면 숨김)</span>}</div>
            {d.noticeItems.map((item,i) => (
              <div key={i} style={{ display:'flex', gap:'6px', marginBottom:'8px' }}>
                <textarea style={{ ...TS, flex:1, minHeight:'52px', fontSize:'12px' }} value={item} onChange={e=>updNotice(i,e.target.value)} />
                <div style={{ display:'flex', flexDirection:'column', gap:'3px', flexShrink:0 }}>
                  <MoveBtn label="↑" onClick={()=>moveItem('noticeItems',i,-1)} disabled={i===0} />
                  <MoveBtn label="↓" onClick={()=>moveItem('noticeItems',i,1)} disabled={i===d.noticeItems.length-1} />
                  <button onClick={()=>delNotice(i)} style={{ padding:'4px 7px', background:'#fff', border:'1px solid #fca5a5', borderRadius:'4px', color:'#ef4444', fontSize:'11px' }}>✕</button>
                </div>
              </div>
            ))}
            <button onClick={addNotice} style={{ width:'100%', padding:'7px', borderRadius:'6px', border:'1px dashed #d1d5db', background:'#f9fafb', color:'#6b7280', fontSize:'13px' }}>+ 안내 추가</button>
          </div>

          {/* 혜택 */}
          <div style={SEC}>
            <div style={SECTITLE}>🎁 혜택 목록 {d.benefits.length === 0 && <span style={{ fontWeight:400, color:'#9ca3af' }}>(비어있으면 숨김)</span>}</div>
            {d.benefits.map((b,i) => (
              <div key={b.id} style={{ background:'#f9fafb', border:'1px solid #e5e7eb', borderRadius:'8px', padding:'12px', marginBottom:'8px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'8px' }}>
                  <span style={{ fontSize:'11px', color:'#6b7280', fontWeight:'600' }}>혜택 {i+1}</span>
                  <div style={{ display:'flex', gap:'4px' }}>
                    <MoveBtn label="↑" onClick={()=>moveItem('benefits',i,-1)} disabled={i===0} />
                    <MoveBtn label="↓" onClick={()=>moveItem('benefits',i,1)} disabled={i===d.benefits.length-1} />
                    <button onClick={()=>delBenefit(i)} style={{ padding:'2px 8px', background:'#fff', border:'1px solid #fca5a5', borderRadius:'4px', color:'#ef4444', fontSize:'11px' }}>삭제</button>
                  </div>
                </div>
                <div style={FG}><label style={LS}>이름</label><input style={IS} value={b.name} onChange={e=>updBenefit(i,'name',e.target.value)} /></div>
                <div style={{ marginBottom:0 }}><label style={LS}>설명</label><input style={IS} value={b.sub} onChange={e=>updBenefit(i,'sub',e.target.value)} /></div>
              </div>
            ))}
            <button onClick={addBenefit} style={{ width:'100%', padding:'8px', borderRadius:'6px', border:'1px dashed #f39200', background:'rgba(243,146,0,0.04)', color:'#f39200', fontSize:'13px', fontWeight:'600' }}>+ 혜택 추가</button>
          </div>

          {/* 기본 필드 */}
          <div style={SEC}>
            <div style={SECTITLE}>🔒 기본 필드 <span style={{ fontWeight:400, color:'#9ca3af' }}>(필수 고정 · 삭제 불가)</span></div>
            <div style={{ fontSize:'11px', color:'#6b7280', marginBottom:'10px', padding:'8px 10px', background:'#f0fdf4', border:'1px solid #bbf7d0', borderRadius:'6px', lineHeight:'1.6' }}>
              구글시트 컬럼 순서: <strong>A. 타임스탬프 → B. 이름 → C. 전화번호 → D. 이메일 → E. 소속</strong><br/>
              이후 추가 필드(F~)가 순서대로 이어집니다.
            </div>
            {(d.fixedFields||[
              {id:'name',label:'이름',placeholder:'홍길동'},
              {id:'phone',label:'전화번호',placeholder:'010-0000-0000'},
              {id:'email',label:'이메일',placeholder:'이메일 주소'},
              {id:'company',label:'직장 또는 소속',placeholder:'직장 또는 소속'},
            ]).map((f, i) => (
              <div key={f.id} style={{ background:'#f9fafb', border:'1px solid #e5e7eb', borderRadius:'8px', padding:'12px', marginBottom:'8px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'6px', marginBottom:'8px' }}>
                  <span style={{ fontSize:'11px', background:'#6b7280', color:'#fff', padding:'2px 7px', borderRadius:'4px', fontWeight:'700' }}>
                    {['B','C','D','E'][i]}열
                  </span>
                  <span style={{ fontSize:'11px', background:'#dcfce7', color:'#166534', padding:'2px 7px', borderRadius:'4px', fontWeight:'600' }}>필수</span>
                  <span style={{ fontSize:'11px', color:'#9ca3af' }}>고정</span>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                  <div>
                    <label style={LS}>라벨 (폼 표시 / 구글시트 컬럼명)</label>
                    <input style={IS} value={f.label} onChange={e=>updFixedField(f.id,'label',e.target.value)} />
                  </div>
                  <div>
                    <label style={LS}>플레이스홀더</label>
                    <input style={IS} value={f.placeholder||''} onChange={e=>updFixedField(f.id,'placeholder',e.target.value)} />
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* 추가 필드 */}
          <div style={SEC}>
            <div style={SECTITLE}>➕ 추가 필드 <span style={{ fontWeight:400, color:'#9ca3af' }}>(소속 입력 후, 참가일시 전에 삽입)</span></div>
            {d.customFields.map((f,i) => (
              <CustomFieldEditor key={f.id} f={f} idx={i} total={d.customFields.length}
                onChange={(key,val)=>updCustomField(i,key,val)}
                onDelete={()=>delCustomField(i)}
                onMove={(dir)=>moveItem('customFields',i,dir)} />
            ))}
            <button onClick={addCustomField} style={{ width:'100%', padding:'8px', borderRadius:'6px', border:'1px dashed #6366f1', background:'rgba(99,102,241,0.04)', color:'#6366f1', fontSize:'13px', fontWeight:'600' }}>+ 필드 추가</button>
          </div>

          {/* 세션 */}
          <div style={SEC}>
            <div style={SECTITLE}>🕐 참가 일시 선택지 <span style={{ fontWeight:400, color:'#9ca3af' }}>(1개면 전체폭 자동)</span></div>
            <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'12px', padding:'10px 12px', background:'rgba(243,146,0,0.06)', border:'1px solid rgba(243,146,0,0.18)', borderRadius:'6px' }}>
              <label style={{ ...LS, margin:0, minWidth:'80px' }}>세션당 정원</label>
              <input type="number" min="1" max="999" style={{ ...IS, width:'80px', textAlign:'center' }}
                value={d.maxPerSlot ?? 15} onChange={e=>upd('maxPerSlot', Number(e.target.value))} />
              <span style={{ fontSize:'12px', color:'#9ca3af' }}>명 (잔여석 실시간 표시)</span>
            </div>
            {d.sessions.map((s,i) => (
              <div key={s.id} style={{ background:'#f9fafb', border:'1px solid #e5e7eb', borderRadius:'8px', padding:'12px', marginBottom:'8px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'8px' }}>
                  <span style={{ fontSize:'11px', color:'#6b7280', fontWeight:'600' }}>세션 {i+1}</span>
                  <div style={{ display:'flex', gap:'4px' }}>
                    <MoveBtn label="↑" onClick={()=>moveItem('sessions',i,-1)} disabled={i===0} />
                    <MoveBtn label="↓" onClick={()=>moveItem('sessions',i,1)} disabled={i===d.sessions.length-1} />
                    <button onClick={()=>delSession(i)} style={{ padding:'2px 8px', background:'#fff', border:'1px solid #fca5a5', borderRadius:'4px', color:'#ef4444', fontSize:'11px' }}>삭제</button>
                  </div>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                  <div><label style={LS}>라벨</label><input style={IS} value={s.label} onChange={e=>updSession(i,'label',e.target.value)} /></div>
                  <div><label style={LS}>시간</label><input style={IS} value={s.time} onChange={e=>updSession(i,'time',e.target.value)} /></div>
                </div>
              </div>
            ))}
            <button onClick={addSession} style={{ width:'100%', padding:'8px', borderRadius:'6px', border:'1px dashed #f39200', background:'rgba(243,146,0,0.04)', color:'#f39200', fontSize:'13px', fontWeight:'600' }}>+ 세션 추가</button>
          </div>

          {/* 폼 텍스트 */}
          <div style={SEC}>
            <div style={SECTITLE}>📝 폼 텍스트</div>
            <div style={FG}><label style={LS}>폼 제목</label><input style={IS} value={d.formTitle} onChange={e=>upd('formTitle',e.target.value)} /></div>
            <div style={FG}><label style={LS}>폼 부제목</label><input style={IS} value={d.formSubtitle} onChange={e=>upd('formSubtitle',e.target.value)} /></div>
            <div style={FG}><label style={LS}>동의 문구</label><textarea style={TS} value={d.agreeText} onChange={e=>upd('agreeText',e.target.value)} /></div>
            <div style={FG}><label style={LS}>완료 제목</label><input style={IS} value={d.successTitle} onChange={e=>upd('successTitle',e.target.value)} /></div>
            <div><label style={LS}>완료 메시지</label><textarea style={TS} value={d.successMsg} onChange={e=>upd('successMsg',e.target.value)} /></div>
          </div>

        </div>

        {/* 미리보기 */}
        <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
          <div style={{ padding:'10px 16px', background:'#fff', borderBottom:'1px solid #e2e8f0', fontSize:'12px', color:'#6b7280', display:'flex', alignItems:'center', gap:'6px' }}>
            <span style={{ width:'8px', height:'8px', borderRadius:'50%', background:'#22c55e', display:'inline-block' }}></span>
            실시간 미리보기
            {d.closed && <span style={{ marginLeft:'8px', fontSize:'11px', background:'#fef3c7', color:'#92400e', padding:'2px 8px', borderRadius:'4px', fontWeight:'600' }}>⚠️ 마감 상태</span>}
            <span style={{ marginLeft:'auto', fontSize:'11px', color:'#94a3b8' }}>※ 잔여석은 미리보기에서 미반영</span>
          </div>
          <iframe srcDoc={buildHTML(d)} style={{ flex:1, border:'none', background:'#0c0c0d' }} title="preview" />
        </div>
      </div>

      {toast && (
        <div style={{ position:'fixed', bottom:'24px', left:'50%', transform:'translateX(-50%)', background:'#1e293b', color:'#fff', padding:'10px 20px', borderRadius:'8px', fontSize:'13px', fontWeight:'500', zIndex:9999, boxShadow:'0 4px 20px rgba(0,0,0,0.3)' }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
